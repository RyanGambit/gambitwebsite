<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Client access — Gambit</title>
<link rel="icon" href="/favicon.ico">
<link rel="icon" type="image/png" href="/img/favicon.png">
<link rel="stylesheet" href="/clients/portal.css">
<style>
  .holder { min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px; }
  .holder .gate-card { padding: 48px 40px 40px; }
  .holder .home-link {
    display: inline-block; margin-top: 4px; font-size: 13px;
    color: var(--secondary); text-decoration: none;
  }
  .holder .home-link:hover { color: var(--ink); }
</style>
</head>
<body>
<div class="portal">
  <div class="holder">
    <div class="gate-card">
      <img class="gate-logo" src="/img/gambit-logo.png" alt="Gambit">
      <p class="gate-eyebrow">Gambit</p>
      <h1 class="gate-title">Client access</h1>
      <p class="gate-sub">This area is private. If you have a workspace with us, open it from the link we sent you.</p>
      <p class="gate-foot">
        Need access? Email <a href="mailto:hello@gambitco.io">hello@gambitco.io</a><br>
        <a class="home-link" href="/">Return to gambitco.io</a>
      </p>
    </div>
  </div>
</div>
</body>
</html>
